name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - name: Checkout verified public asset snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lliooly/wuwa-tappo-assets
          ref: 3b23b04468174fd1329473c64e2a4254999bb819
          path: wuwa-tappo-assets
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify repository and recovery evidence
        run: python3 scripts/check-repository.py
      - name: Verify animation behavior and asset selection
        run: node --test tests/animation.test.js
      - name: Install asset tool dependencies
        run: python -m pip install -r requirements-art.txt
      - name: Verify image tool compatibility
        run: python scripts/verify-tool-images.py
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: python3 scripts/build-macos.py
      - name: Verify shipped frontend and package
        if: runner.os == 'macOS'
        run: |
          npm test
          python3 scripts/verify-original-port.py
          python3 scripts/verify-package.py
      - name: Verify native storage
        if: runner.os == 'macOS'
        run: |
          python3 scripts/verify-click-store.py
          python3 scripts/verify-session-store.py
